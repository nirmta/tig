version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./main.go
    binary: tig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: tig
    homepage: "https://github.com/nirmta/tig"
    description: "user git credentials manager"

    repository:
      owner: nirmta
      name: homebrew-tig

    binaries:
      - tig

nfpms:
  - id: tig
    package_name: tig
    vendor: nirmta
    homepage: "https://github.com/nirmta/tig"
    maintainer: "nirmta"
    description: "User git credentials manager"
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
